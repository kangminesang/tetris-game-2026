<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock - Multiple Time Zones</title>
    <link rel="stylesheet" href="clock-style.css">
</head>
<body>
    <h1>Digital Clock - Multiple Time Zones</h1>
    <div class="clock-container">
        <div class="clock">
            <div class="timezone-name">New York (EST)</div>
            <div class="time" id="nyTime">00:00:00</div>
        </div>
        <div class="clock">
            <div class="timezone-name">London (GMT)</div>
            <div class="time" id="londonTime">00:00:00</div>
        </div>
        <div class="clock">
            <div class="timezone-name">Tokyo (JST)</div>
            <div class="time" id="tokyoTime">00:00:00</div>
        </div>
        <div class="clock">
            <div class="timezone-name">Sydney (AEDT)</div>
            <div class="time" id="sydneyTime">00:00:00</div>
        </div>
        <div class="clock">
            <div class="timezone-name">Dubai (GST)</div>
            <div class="time" id="dubaiTime">00:00:00</div>
        </div>
        <div class="clock">
            <div class="timezone-name">Los Angeles (PST)</div>
            <div class="time" id="laTime">00:00:00</div>
        </div>
    </div>
    <script src="clock.js"></script>
</body>
</html>
